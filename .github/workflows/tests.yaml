name: Tests
on:
  pull_request:
  push:
    branches: [main, stable]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
    inputs:
      entries-per-runner:
        description: Python versions on each ubuntu-latest runner. 1 reproduces one job per version.
        type: choice
        options: ['1', '2', '4']
        default: '2'
env:
  # Versions packed onto ubuntu-latest runners. 3.9 is not published for
  # ubuntu-latest, so it keeps its own ubuntu-24.04 job (matrix include below).
  PYTHON_VERSIONS: '["3.13", "3.12", "3.11", "3.10"]'
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      pools: ${{ steps.matrix.outputs.pools }}
    steps:
      - id: count
        run: echo "count=$(jq length <<< "$PYTHON_VERSIONS")" >> "$GITHUB_OUTPUT"
      - uses: gigaverse-app/ci-esta/actions/plan-runner-pools@v1
        id: pools
        with:
          shards: ${{ steps.count.outputs.count }}
          shards-per-runner: ${{ inputs.entries-per-runner || '2' }}
      - id: matrix
        env:
          POOLS: ${{ steps.pools.outputs.pools }}
        run: >
          echo "pools=$(jq -c --argjson v "$PYTHON_VERSIONS"
          'map(. + {versions: $v[.first_shard - 1:.last_shard]})' <<< "$POOLS")"
          >> "$GITHUB_OUTPUT"
  tests:
    name: ${{ join(matrix.pool.versions, ', ') }}
    needs: plan
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        pool: ${{ fromJSON(needs.plan.outputs.pools) }}
        include:
          - {pool: {id: py3.9, versions: ['3.9']}, os: ubuntu-24.04}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          enable-cache: true
          prune-cache: false
      - id: versions
        env:
          VERSIONS: ${{ toJSON(matrix.pool.versions) }}
        run: |
          {
            echo 'list<<EOF'
            jq -r '.[]' <<< "$VERSIONS"
            echo 'EOF'
            echo "envs=$(jq -r 'map("py" + .) | join(",")' <<< "$VERSIONS")"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.versions.outputs.list }}
      - name: Run this runner's tox environments
        env:
          ENVS: ${{ steps.versions.outputs.envs }}
          POOL: ${{ matrix.pool.id }}
        run: >
          uv run --locked tox run-parallel --parallel auto --parallel-no-spinner
          --result-json "tox-results-$POOL.json" -e "$ENVS"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: tox-results-${{ matrix.pool.id }}
          path: tox-results-*.json
          if-no-files-found: error
  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6.1.0
        with:
          enable-cache: true
          prune-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: cache mypy
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ./.mypy_cache
          key: mypy|${{ hashFiles('pyproject.toml') }}
      - run: uv run --locked tox run -e typing
  validation-gate:
    name: Validation gate
    needs: [plan, tests, typing]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: gigaverse-app/ci-esta/actions/validation-gate@v1
        with:
          needs: ${{ toJSON(needs) }}
