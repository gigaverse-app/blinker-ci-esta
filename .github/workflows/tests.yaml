name: Tests
env:
  PYTHON_VERSIONS: '["3.13", "3.12", "3.11", "3.10"]'
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      pools: ${{ steps.matrix.outputs.pools }}
    steps:
    - id: count
      run: echo "count=$(jq length <<< "$PYTHON_VERSIONS")" >> "$GITHUB_OUTPUT"
    - uses: gigaverse-app/ci-esta/actions/plan-runner-pools@v1
      id: pools
      with:
        shards: ${{ steps.count.outputs.count }}
        shards-per-runner: '2'
    - id: matrix
      env:
        POOLS: ${{ steps.pools.outputs.pools }}
      run: 'echo "pools=$(jq -c --argjson v "$PYTHON_VERSIONS" ''map(. + {versions: $v[.first_shard - 1:.last_shard]})'' <<<
        "$POOLS")" >> "$GITHUB_OUTPUT"

        '
    if: inputs.mode == 'packed'
  tests:
    name: ${{ join(matrix.pool.versions, ', ') }}
    needs: plan
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        pool: ${{ fromJSON(needs.plan.outputs.pools) }}
        include:
        - pool:
            id: py3.9
            versions:
            - '3.9'
          os: ubuntu-24.04
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb
      with:
        enable-cache: true
        prune-cache: false
    - id: versions
      env:
        VERSIONS: ${{ toJSON(matrix.pool.versions) }}
      run: "{\n  echo 'list<<EOF'\n  jq -r '.[]' <<< \"$VERSIONS\"\n  echo 'EOF'\n  echo \"envs=$(jq -r 'map(\"py\" + .) |\
        \ join(\",\")' <<< \"$VERSIONS\")\"\n} >> \"$GITHUB_OUTPUT\"\n"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ steps.versions.outputs.list }}
    - name: Run this runner's tox environments
      env:
        ENVS: ${{ steps.versions.outputs.envs }}
        POOL: ${{ matrix.pool.id }}
      run: 'uv run --locked tox run-parallel --parallel auto --parallel-no-spinner --result-json "tox-results-$POOL.json"
        -e "$ENVS"

        '
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: tox-results-${{ matrix.pool.id }}
        path: tox-results-*.json
        if-no-files-found: error
  typing:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb
      with:
        enable-cache: true
        prune-cache: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: cache mypy
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: ./.mypy_cache
        key: mypy|${{ hashFiles('pyproject.toml') }}
    - run: uv run --locked tox run -e typing
    if: inputs.mode == 'packed'
  validation-gate:
    name: Validation gate
    needs:
    - plan
    - tests
    - typing
    if: '!cancelled() && inputs.mode == ''packed'''
    runs-on: ubuntu-latest
    steps:
    - uses: gigaverse-app/ci-esta/actions/validation-gate@v1
      with:
        needs: ${{ toJSON(needs) }}
  original-tests:
    name: ${{ matrix.name || matrix.python }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - python: '3.13'
        - python: '3.12'
        - python: '3.11'
        - python: '3.10'
        - python: '3.9'
          os: ubuntu-24.04
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb
      with:
        enable-cache: true
        prune-cache: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ matrix.python }}
    - run: uv run --locked tox run -e ${{ matrix.tox || format('py{0}', matrix.python) }}
    if: inputs.mode == 'original'
  original-typing:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb
      with:
        enable-cache: true
        prune-cache: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - name: cache mypy
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: ./.mypy_cache
        key: mypy|${{ hashFiles('pyproject.toml') }}
    - run: uv run --locked tox run -e typing
    if: inputs.mode == 'original'
'on':
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options:
        - original
        - packed
        required: true
run-name: Historical PR 184 mode=${{ inputs.mode }}
